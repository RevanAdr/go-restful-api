services:
  db:
    image: postgres:18
    container_name: restful-postgres
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: golang
      POSTGRES_DB: order-garment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: restful-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: garment@gmail.com
      PGADMIN_DEFAULT_PASSWORD: orderm129
    depends_on:
      - db
    ports:
      - "8080:80"

volumes:
  postgres_data:
